<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/reset.css" type="text/css">
    <link rel="stylesheet" href="../style/style.css" type="text/css">
    <link rel="stylesheet" href="../style/stock_plus.css" type="text/css">
    <title>管理システム ログイン</title>
</head>

<body>
    <di class="app">
        <header>
            <div class="title">
                <img src="../images/OCHAZON.png" alt="ロゴ画像" class="OCHAZON">
                <h1>管理システム</h1>
            </div>

            <input type="search" id="site-search" name="site-search" class="title-search" placeholder=" search" />
            <img src="../images/notice.png" alt="通知画像" class="notice">
            <img src="../images/user.png" alt="ユーザー画像" class="user">
        </header>
        <main>
            <nav>
            <form action="home_admin.html">
                <input type="submit" value="ホーム" class="home"><br>
            </form>

            <form action="stock_management.html">
                <input type="submit" value="在庫管理" class="stock"><br>
            </form>

            <form action="goods_management.html">
                <input type="submit" value="商品管理" class="goods"><br>
            </form>

            <form action="member_management.html">
                <input type="submit" value="会員管理" class="member"><br>
            </form>

            <form action="authority_management.html">
                <input type="submit" value="権限管理" class="authority"><br>
            </form>
            </nav>
            
            <div class="flex-content">
                <div class="flex">
                    <a href="stock_management.html">
                        <img src="../images/back.png" alt="戻るボタン" id="back-btn">
                    </a>
                    <h2>製品情報の入力</h2>
                </div>
            <div class="stock-container">

                    <div class="category">
                        <div class="category2">
                            <label for="category3">分類</label>
                        </div>
                        <div class="category6">
                            <input type="text" id="category4" class="category5"/>
                        </div>
                    </div>

                    <div class="number">
                        <div class="number2">
                            <label for="number3">品番号</label>
                        </div>
                        <div class="number6">
                            <input type="text" id="number4" class="number5"/>
                        </div>
                    </div>

                    <div class="name">
                        <div class="name2">
                            <label for="name3">品名</label>
                        </div>
                        <div class="name6">
                            <input type="text" id="name4" class="name5"/>
                        </div>
                    </div>

                    <div class="Supplier">
                        <div class="Supplier2">
                            <label for="Supplier3">仕入先名</label>
                        </div>
                        <div class="Supplier6">
                            <input type="text" id="Supplier4" class="Supplier5"/>
                        </div>
                    </div>

                    <div class="manager">
                        <div class="manager2">
                            <label for="manager3">担当者</label>
                        </div>
                        <div class="manager6">
                            <input type="text" id="manager4" class="manager5"/>
                        </div>
                    </div>

                    <div class="stock1">
                        <div class="stock2">
                            <label for="stock3">在庫</label>
                        </div>
                        <div class="stock6">
                            <input type="text" id="stock4" class="stock5"/>
                        </div>
                    </div>

                    <div class="remarks">
                        <div class="remarks2">
                            <label for="remarks3">備考</label>
                        </div>
                        <div class="remarks6">
                            <input type="text" id="remarks4" class="remarks5"/>
                        </div>
                    </div>

                    <div class="time">
                        <div class="time2">
                            <label for="time3">登録日時</label>
                        </div>
                        <div class="time4">
                            <div class="time5">
                            <script type="text/javascript">
                                var weeks = new Array('日','月','火','水','木','金','土');
                                
                                var now = new Date();
                                
                                var year = now.getYear(); // 年
                                var month = now.getMonth() + 1; // 月
                                var day = now.getDate(); // 日
                                var week = weeks[ now.getDay() ]; // 曜日
                                var hour = now.getHours(); // 時
                                var min = now.getMinutes(); // 分
                                var sec = now.getSeconds(); // 秒
                                
                                if(year < 2000) { year += 1900; }
                                
                                // 数値が1桁の場合、頭に0を付けて2桁で表示する指定
                                if(month < 10) { month = "0" + month; }
                                if(day < 10) { day = "0" + day; }
                                if(hour < 10) { hour = "0" + hour; }
                                if(min < 10) { min = "0" + min; }
                                if(sec < 10) { sec = "0" + sec; }
                                
                                // 表示開始
                                document.write(year + '年' + month + '月' + day + '日（' + week + '）');
                                document.write(hour + '時' + min + '分' + sec + '秒</b>');
                                // 表示終了
                                
                                // -->
                                </script>
                                </div>
                        </div>
                    </div>

                    <div class="Registration">
                        <form action="stock_confirmation.html" method="post">
                            <input type="submit" value="登録" class="Registration2"><br>
                        </form>
                    </div>

        </main>
        <script src="../script/reload.js/"></script>
</body>

</html>
